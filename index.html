<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic Quiz Application</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- START SCREEN -->
      <div id="start-screen">
        <h1>🎯 Dynamic Quiz</h1>

        <label>Category</label>
        <select id="category">
          <option value="web">Web Development</option>
          <option value="testing">Software Testing</option>
        </select>

        <label>Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>

        <button onclick="startQuiz()">Start Quiz</button>
      </div>

      <!-- QUIZ SCREEN -->
      <div id="quiz-box" class="hidden">
        <div class="top-bar">
          <span id="qno"></span>
          <span class="timer">⏱ <span id="time">15</span>s</span>
        </div>

        <h2 id="question"></h2>
        <div id="options"></div>

        <div class="buttons">
          <button onclick="prevQuestion()">Previous</button>
          <button onclick="nextQuestion()">Next</button>
        </div>
      </div>

      <!-- RESULT SCREEN -->
      <div id="result-box" class="hidden">
        <h2>📊 Result Analysis</h2>
        <p>Total Questions: <span id="total"></span></p>
        <p>Correct Answers: <span id="correct"></span></p>
        <p>Wrong Answers: <span id="wrong"></span></p>

        <canvas id="resultChart"></canvas>

        <button onclick="location.reload()">Restart Quiz</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
